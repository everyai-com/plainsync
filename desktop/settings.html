<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>PlainSync server</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #fbfaf7; color: #22231f; }
      main { padding: 34px; }
      .eyebrow { color: #2e6a51; font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; }
      h1 { margin: 9px 0 8px; font-size: 25px; letter-spacing: -.03em; }
      p { margin: 0 0 22px; color: #67685f; font-size: 13px; line-height: 1.55; }
      label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
      input { box-sizing: border-box; width: 100%; height: 42px; padding: 0 12px; border: 1px solid #cbc7bc; border-radius: 8px; color: inherit; background: #fffefd; font: 13px ui-monospace, monospace; outline: none; }
      input:focus { border-color: #2e6a51; box-shadow: 0 0 0 3px rgba(46,106,81,.12); }
      .message { min-height: 18px; margin: 8px 0; color: #b54735; font-size: 12px; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
      button { height: 38px; padding: 0 13px; border: 1px solid #cbc7bc; border-radius: 8px; color: inherit; background: #fffefd; font-weight: 700; cursor: pointer; }
      button[type="submit"] { border-color: #2e6a51; color: white; background: #2e6a51; }
      @media (prefers-color-scheme: dark) {
        body { background: #191a17; color: #ecede7; }
        p { color: #abad9f; }
        input, button { border-color: #44463e; background: #1f201c; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Your server, your documents</div>
      <h1>Connect PlainSync</h1>
      <p>Use the hosted app or point this desktop app at any PlainSync instance you control.</p>
      <form id="server-form">
        <label for="server-url">PlainSync server address</label>
        <input id="server-url" name="server-url" type="url" required spellcheck="false" autocomplete="url" />
        <div class="message" id="message" role="status"></div>
        <div class="actions">
          <button type="button" id="hosted">Use hosted app</button>
          <button type="submit">Connect</button>
        </div>
      </form>
    </main>
    <script>
      const form = document.querySelector('#server-form');
      const input = document.querySelector('#server-url');
      const message = document.querySelector('#message');
      const hosted = document.querySelector('#hosted');

      window.plainSyncDesktop.getSettings().then((settings) => {
        input.value = settings.current;
        input.select();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        const result = await window.plainSyncDesktop.saveServer(input.value);
        if (!result.ok) message.textContent = result.message;
      });

      hosted.addEventListener('click', async () => {
        message.textContent = '';
        const result = await window.plainSyncDesktop.useHosted();
        if (!result.ok) message.textContent = result.message;
      });
    </script>
  </body>
</html>
