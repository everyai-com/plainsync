name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm exec --workspace plainsync-desktop -- electron-builder --mac dmg --x64 --arm64 --publish never
          - name: Windows
            os: windows-latest
            command: npm exec --workspace plainsync-desktop -- electron-builder --win nsis --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: plainsync-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "PlainSync $GITHUB_REF_NAME"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
